<!DOCTYPE html>
<html>
<head>
    <title>Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ IMPORTANT FIX -->
    <style>
        body {
            background: linear-gradient(to right,#ca7186,#db8c7e);
            color:white;
        }
        #map {
            height:400px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

<h2>🩸 Donor Results</h2>

{% if rare %}
<div class="alert alert-danger">{{ rare }}</div>
{% endif %}

<div id="map"></div>

<div class="row mt-3">
{% for d in donors %}
<div class="col-md-4">
<div class="card bg-dark p-3 mb-3">
<h5>{{d[1]}}</h5>
<p>{{d[2]}}</p>
<p>{{d[3]}}</p>
<p>{{d[4]}}</p>
</div>
</div>
{% endfor %}
</div>

</div>

<script>
function initMap()
{

    var map = new google.maps.Map(document.getElementById("map"),{
        zoom:5,
        center:{lat:20.5937,lng:78.9629}
    });

    // ✅ MOST IMPORTANT FIX


    console.log(donors); // debug

    for(let i=0;i<donors.length;i++){

        let d = donors[i];

        if(!d.lat || !d.lon) continue;

        let lat = parseFloat(d.lat);
        let lon = parseFloat(d.lon);

        if(isNaN(lat) || isNaN(lon)) continue;

        let marker = new google.maps.Marker({
            position:{lat:lat,lng:lon},
            map:map
        });

        let info = new google.maps.InfoWindow({
            content: "<b>"+d.name+"</b><br>"+d.location
        });

        marker.addListener("click",function(){
            info.open(map,marker);
        });
    }
}
</script>

</body>
</html>
